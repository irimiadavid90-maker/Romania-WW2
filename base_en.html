<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romania in World War II</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="home-fara-scroll">

    <header>
        <div class="title-container">
            <img src="armenoi.png" class="arma-stanga" alt="">
            <h1>Romania in World War II</h1>
            <img src="armenoi.png" class="arma-dreapta" alt="">
        </div>
        <nav>
            <ul>
                <li><a href="base_en.html" class="active"><i class="fa-solid fa-house"></i></a></li>
                <li><a href="pierderi_en.html">Territorial Losses</a></li>
                <li><a href="antonescu_en.html">Ion Antonescu</a></li>
                <li><a href="frontul-est_en.html">Eastern Front</a></li>
                <li><a href="mihai_en.html">King Michael I</a></li>
                <li><a href="quiz_en.html">Quiz</a></li>

                <li class="language-selector">
                    <button class="lang-btn" id="lang-btn">
                        <img src="steag_en.png" alt="EN" class="flag-icon"> EN <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <ul class="lang-dropdown" id="lang-dropdown">
                        <li><a href="base.html"><img src="steag_ro.png" alt="RO" class="flag-icon"> Română</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main class="homepage-hero">
        <video autoplay loop muted playsinline class="hero-video">
            <source src="fundal.mp4" type="video/mp4">
        </video>
        <div class="quote-container">
            <p class="history-quote">
                "History will not forget the guilty, and we are all guilty: some because we remained silent, others because we erred, all of us because we endured." - Ion Antonescu
            </p>
        </div>
        <img src="miller-removebg-preview.png" class="corner-image">
    </main>

    <script>
        const langBtn = document.getElementById('lang-btn');
        const langDropdown = document.getElementById('lang-dropdown');

        langBtn.addEventListener('click', function(event) {
            langDropdown.classList.toggle('show');
            event.stopPropagation();
        });

        document.addEventListener('click', function(event) {
            if (!langDropdown.contains(event.target)) {
                langDropdown.classList.remove('show');
            }
        });
    </script>
</body>
</html>
